name: Verify live full-background careers
on:
  push:
    branches: [codex/authorized-resume-reset-20261027]
    paths: ['scripts/app-account-maintenance/**', '.github/workflows/authorized-app-account.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify owner-scoped reset logic with fictional accounts
        run: node --test scripts/app-account-maintenance/cleanup.test.cjs
      - run: npm install --prefix /tmp/vcp-reset --no-audit --no-fund firebase-admin@13.0.0
      - name: Verify live career breadth using a disposable fictional account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/app-account-maintenance/verify-live.cjs
