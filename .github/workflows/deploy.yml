name: Validate and Deploy Firebase Hosting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate sitemap
        run: python generate-sitemap.py

      - name: Install build deps
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check assets/js/vcb-secure-api.js
          node --check scripts/build-hosting.mjs
          node --check scripts/apply-security-refactor.mjs

      - name: Verify website security protections
        run: node --test test/security-headers.test.mjs test/hosting-domains.test.mjs

      - name: Verify app.bundle.js + app.html are in sync with app.js
        run: |
          npm run build
          if ! git diff --quiet -- app.bundle.js app.html; then
            echo "::error::app.bundle.js/app.html out of sync. Run 'npm run build' and commit both."
            git --no-pager diff --stat -- app.bundle.js app.html
            exit 1
          fi
          echo "app.bundle.js + app.html are in sync with app.js"

      - name: Build veteran resume workspace
        run: node scripts/build-resume-workspace.mjs

      - name: Verify administrator reporting and billing journeys
        working-directory: resume-workspace-src
        run: npx playwright test --config=playwright.career.config.mjs admin-dashboard.spec.mjs --max-failures=1

      - name: Verify simplified resume journeys
        working-directory: resume-workspace-src
        run: npx playwright test --config=playwright.career.config.mjs app-shell.spec.mjs cover-letters.spec.mjs entry-flow.spec.mjs analytics.spec.mjs clear-journey.spec.mjs career-extras.spec.mjs --max-failures=1

      - name: Verify career tools in a mobile browser
        working-directory: resume-workspace-src
        run: |
          npm run test:career-browser

      - name: Upload fictional app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ux-previews
          path: |
            /tmp/vcp-ux-previews
            resume-workspace-src/test-results
          retention-days: 3
          if-no-files-found: ignore

      - name: Build Firebase hosting directory
        run: node scripts/build-hosting.mjs

      - name: Start local site
        run: |
          npx --yes http-server .firebase-public -p 8080 -c-1 > /tmp/vcp-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vcp-http.log
          exit 1

      - name: Lighthouse CI before production
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:8080/
            http://127.0.0.1:8080/army-mos-careers.html
            http://127.0.0.1:8080/military-transition-guide.html
            http://127.0.0.1:8080/mos/12p.html
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true

      - name: Package the built site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .firebase-public

  publish-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for conflicting Pages publishers
        run: node scripts/check-pages-source.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the built site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published app, owner guide and protected billing route
        run: node scripts/verify-published-pages.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate sitemap
        run: python generate-sitemap.py

      - name: Build veteran resume workspace
        run: node scripts/build-resume-workspace.mjs

      - name: Build Firebase hosting directory
        run: node scripts/build-hosting.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: veteran-career-builder
          force: true


