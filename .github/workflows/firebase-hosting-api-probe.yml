name: Check authorized Firebase Hosting API access
on:
  push:
    branches: [codex/firebase-rest-publisher-20261108]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Phocas88/Veteran_Career_Builder' && github.actor == 'Phocas88'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Hosting access with the existing deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import {parseDeployCredential,deployAssertion} from './scripts/check-firebase-hosting-access.mjs';
          try {
            const credential=parseDeployCredential(process.env.FIREBASE_SERVICE_ACCOUNT);
            const response=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:deployAssertion(credential)}),redirect:'error',signal:AbortSignal.timeout(15000)});
            const token=await response.json();
            if(!response.ok||typeof token.access_token!=='string')throw new Error('AUTHENTICATION_FAILED');
            const headers={Authorization:'Bearer '+token.access_token};
            const list=await fetch('https://firebasehosting.googleapis.com/v1beta1/projects/veteran-career-builder/sites',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            const sites=await list.json();
            console.log('HOSTING_LIST_STATUS '+list.status);
            if(!list.ok){console.log('HOSTING_LIST_DENIED');process.exitCode=1;}
            else console.log('HOSTING_SITE_NAMES '+JSON.stringify((sites.sites||[]).map(site=>site.name).filter(name=>/^projects\/[a-z0-9-]+\/sites\/[a-z0-9-]+$/.test(name))));
            const site=await fetch('https://firebasehosting.googleapis.com/v1beta1/projects/veteran-career-builder/sites/veteran-career-builder',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            console.log('HOSTING_SITE_STATUS '+site.status);
            if(!site.ok)process.exitCode=1;
          }catch { console.log('HOSTING_API_PROBE_FAILED');process.exitCode=1; }
          NODE
