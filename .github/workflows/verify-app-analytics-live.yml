# Test partition-scoped cookie compatibility before changing production.
# Hosted collector diagnostic rerun.
name: Verify live app analytics privacy
on:
  push:
    branches: [codex/verify-app-analytics-live]
    paths: [.github/workflows/verify-app-analytics-live.yml]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app browser test dependencies
        working-directory: resume-workspace-src
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Verify public app assets, guide, policies and collector headers
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          expected = {'app.js': '9628baac55866f9006f8feebbc2570ba164d8cfd0cfadcad27553a435fc476f6', 'analytics.js': '693d3cb6968f0113f6fb0d2d0e42e24136b1bf46c4198665b9dc70d61af26afb', 'analytics-model.js': '495d0d001a770f24954aea75a7fe79d5f30e7213b40dc07f6387bb1ae48e5f30', 'analytics.css': 'ffab461d3039d4d4503cacc65ffc040f92c49e55f1d225ffb1307fb8887d413a'}
          base='https://veterancareerpath.com/resumereview/'
          release='0aa6e9b897c4cff4271185eeec8f17c5b787fe6e'
          def read(name):
           request=urllib.request.Request(base+name+'?release='+release,headers={'User-Agent':'VCP-public-analytics-check','Cache-Control':'no-cache'})
           with urllib.request.urlopen(request,timeout=20) as response:
            if response.status!=200:raise RuntimeError('Unexpected public HTTP status')
            return response.read()
          for attempt in range(40):
           try:
            app=read('')
            if b'app.js?v=20261029-analytics' not in app or b'usage-analytics-notice' not in app:raise RuntimeError('Waiting for the app release')
            for name,digest in expected.items():
             if hashlib.sha256(read(name)).hexdigest()!=digest:raise RuntimeError('Waiting for matching analytics assets')
            if b'G-CMFKLT321J' not in read('analytics-guide.html'):raise RuntimeError('Waiting for reporting guide')
            if b'usage-analytics' not in read('privacy.html'):raise RuntimeError('Waiting for updated privacy notice')
            request=urllib.request.Request('https://vcp-proxy.vercel.app/api/resume-analytics?v='+release,headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(request,timeout=20) as response:
             if response.status!=200 or response.headers.get('Referrer-Policy')!='no-referrer':raise RuntimeError('Unexpected collector headers')
             if b'G-CMFKLT321J' not in response.read():raise RuntimeError('Unexpected analytics destination')
            print('LIVE_APP_ANALYTICS_CHECK '+json.dumps({'httpStatus':200,'matchingAssets':len(expected),'ownerGuide':True,'privacyUpdated':True,'collectorPublic':True,'collectorReferrerBlocked':True}))
            break
           except Exception as error:
            print('Publication check '+str(attempt+1)+': '+type(error).__name__)
            if attempt==39:raise SystemExit('The public analytics release was not verified.')
            time.sleep(20)
          PY
      - name: Verify the hosted collector with the real SDK without delivering analytics hits
        working-directory: resume-workspace-src
        run: node scripts/verify-live-analytics.mjs
