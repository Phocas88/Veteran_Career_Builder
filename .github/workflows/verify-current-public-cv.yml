name: Verify current public CV formatting
on:
  push:
    branches: [codex/verify-current-cv-formatting]
    paths: ['scripts/verify-current-public-cv.cjs', '.github/workflows/verify-current-public-cv.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read the existing public CV without signing in or changing user data
        run: node scripts/verify-current-public-cv.cjs
