name: Verify public VA calculator release
on:
  push:
    branches: [codex/verify-va-calculator-live]
    paths: [.github/workflows/verify-va-calculator-live.yml]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify anonymous public calculator files without account access or secrets
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          expected = {'app.js': 'db20f368a781acbb28fd8a0e4d552932da530065d012ea97960d18f788fa739a', 'app-resources.js': '4e1d7173fa5ae07f7381b02c9d4733af97e56b47f3cee5717a4591723971753a', 'va-calculator.js': '1e12b5a4210a4b0304c3cd29fb8d5918f5872e7256830c91bd4e690fcf4dbf73', 'va-calculator-model.js': '893d0d799b6f13042ebaf06637a30ee44a54411d88bee5906e7a6932e490a019', 'va-conditions.js': 'df492a41cfdaa801c72c5d14ab19a7ffd75649bbcf16c1671c9b4723a0b9a687', 'va-calculator.css': 'ce5c393724a9822353f88e67bdf1688ebfbb169b1b39eb9bd64278a297bd9c38'}
          base = 'https://veterancareerpath.com/resumereview/'
          release = 'a20e691f1970686cc42dfeeca7a5ca245f4c27c8'
          def read(name):
              request=urllib.request.Request(base+name+'?release='+release,headers={'User-Agent':'VCP-public-release-check','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  if response.status != 200: raise RuntimeError('Unexpected HTTP status')
                  return response.read()
          for attempt in range(40):
              try:
                  index=read('')
                  if b'app.js?v=20261028-va-pdf' not in index or b'id="va-download-pdf"' not in index:
                      raise RuntimeError('Waiting for the published UI version')
                  for name, digest in expected.items():
                      if hashlib.sha256(read(name)).hexdigest() != digest:
                          raise RuntimeError('Waiting for matching public assets')
                  print('LIVE_VA_CHECK '+json.dumps({'httpStatus':200,'release':release,'matchingAssets':len(expected),'hasDirectPdfDownload':True,'has2027ColaEstimate':True}))
                  break
              except Exception as error:
                  print('Publication check '+str(attempt+1)+': '+type(error).__name__)
                  if attempt == 39: raise SystemExit('The expected calculator release was not confirmed on the public domain.')
                  time.sleep(20)
          PY
